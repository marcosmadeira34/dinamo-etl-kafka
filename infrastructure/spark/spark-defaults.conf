# =============================================================================
# Spark Defaults — Tuned for Kafka Structured Streaming + S3A
# infrastructure/spark/spark-defaults.conf
# =============================================================================

# --- Application ---
spark.app.name                                    DinamoETL-StreamingPlatform

# --- Adaptive Query Execution ---
spark.sql.adaptive.enabled                        true
spark.sql.adaptive.coalescePartitions.enabled      true
spark.sql.adaptive.skewJoin.enabled               true
spark.sql.adaptive.skewJoin.skewedPartitionThresholdInBytes  256m
spark.sql.adaptive.advisoryPartitionSizeInBytes    128m

# --- Shuffle ---
spark.sql.shuffle.partitions                      200
spark.shuffle.compress                            true
spark.shuffle.spill.compress                      true

# --- Memory ---
spark.executor.memory                             2g
spark.driver.memory                               2g
spark.executor.memoryOverhead                     512m
spark.memory.fraction                             0.8
spark.memory.storageFraction                      0.3

# --- Serialization ---
spark.serializer                                  org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max                   256m

# --- Compression ---
spark.sql.parquet.compression.codec               snappy
spark.io.compression.codec                        lz4

# --- Kafka Structured Streaming ---
spark.sql.streaming.checkpointLocation             /opt/spark/checkpoints
spark.streaming.backpressure.enabled               true
spark.streaming.kafka.maxRatePerPartition           10000
spark.sql.streaming.stateStore.providerClass        org.apache.spark.sql.execution.streaming.state.HDFSBackedStateStoreProvider
spark.sql.streaming.noDataMicroBatches.enabled      false

# --- S3A / OCI Object Storage ---
spark.hadoop.fs.s3a.impl                           org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.path.style.access              true
spark.hadoop.fs.s3a.connection.ssl.enabled         true
spark.hadoop.fs.s3a.aws.credentials.provider       org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.connection.maximum             200
spark.hadoop.fs.s3a.fast.upload                    true
spark.hadoop.fs.s3a.fast.upload.buffer             disk
spark.hadoop.fs.s3a.multipart.size                 67108864
spark.hadoop.fs.s3a.threads.max                    64

# --- Delta Lake ---
spark.sql.extensions                              io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                    org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.databricks.delta.optimizeWrite.enabled        true
spark.databricks.delta.autoCompact.enabled         true

# --- Session ---
spark.sql.session.timeZone                        UTC
spark.sql.files.maxPartitionBytes                  134217728
spark.sql.sources.partitionOverwriteMode           dynamic

# --- Metrics (Prometheus) ---
spark.metrics.conf.*.sink.prometheusServlet.class  org.apache.spark.metrics.sink.PrometheusServlet
spark.metrics.conf.*.sink.prometheusServlet.path   /metrics/prometheus
spark.ui.prometheus.enabled                        true

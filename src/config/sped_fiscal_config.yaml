# dinamo_web/config/business_rules.yaml

# Classificações para a coluna 'CRED-DEB CBS/IBS'
credit_classifications:
  cancelled_nf: "NF Cancelada"
  fixed_assets: "Ativo Imobilizado"
  services: "Servicos"
  electricity: "Energia Eletrica"
  freigth: "Frete"
  other_operations: "Outros"
  # Adicionar outras classificações conforme necessário

  # Mapeamento do tipo de registro para a classificação
record_to_classification_map:
  "G110/G115": "fixed_assets"
  "A100/A170": "services"
  "C500/C501/C505": "electricity"
  "D100/D101/D105": "freigth"
  "F100": "other_operations"
  "F120/F130": "fixed_assets"
  # Adicionar outras classificações conforme necessário

  # Codigos de situacao do documento que indicam cancelamento
cancelled_situations:
  - "02 - Nota Fiscal Cancelada"
  - "04 - Nota Fiscal Denegada"
  - "05 - Nota Fiscal Inutilizada"

# Codigos de situacao do documento (sem descricao) para facilitar o filtro
cancelled_situation_codes:
  - "02"
  - "04"
  - "05"

# Filtros para os blocos lógicos
# Registros que vêm do SPED Contribuicoes e sao tratados como "Servicos e Outros"
sped_contribuicoes_service_records:
  - "A100/A170"
  - "F100"

# Registros que devem ser excluidos da busca por match de saida
sped_contribuicoes_exclude_from_match:
  - "A100/A170"
  - "F100"

# Strings constantes
origin_system:
  sped_fiscal: "SPED Fiscal"
  sped_contribuicoes: "SPED Contribuicoes"

# config.yaml (estrutura esperada pelo código)
regime_tributario:
  bucket_name: "datafoundation-agtax-evollux-prd"
  path: "REGIME_TRIBUTARIO/"

